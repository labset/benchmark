syntax = "proto3";

package content.v1;

import "google/protobuf/timestamp.proto";

option go_package = "content/v1;contentv1";
option java_multiple_files = true;
option java_package = "com.labset.benchmark.content.v1";
option csharp_namespace = "Labset.Benchmark.Content.V1";

enum ContentStatus {
  CONTENT_STATUS_UNSPECIFIED = 0;
  CONTENT_STATUS_DRAFT = 1;
  CONTENT_STATUS_PUBLISHED = 2;
  CONTENT_STATUS_ARCHIVED = 3;
}

message Content {
  string id = 1;
  string title = 2;
  string body = 3;
  ContentStatus status = 4;
  repeated string tags = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}
