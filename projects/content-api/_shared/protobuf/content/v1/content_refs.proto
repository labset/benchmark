syntax = "proto3";

package content.v1;

import "buf/validate/validate.proto";

option go_package = "content/v1;contentv1";
option java_multiple_files = true;
option java_package = "com.labset.benchmark.content.v1";
option csharp_namespace = "Labset.Benchmark.Content.V1";

message ContentRef {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
