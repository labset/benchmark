syntax = "proto3";

package content.v1;

option java_multiple_files = true;
option java_package = "com.labset.benchmark.content.v1";

service ContentService {
  rpc CheckHealth(HealthRequest) returns (HealthResponse);
  rpc ListContent(ListContentRequest) returns (ListContentResponse);
  rpc GetContent(GetContentRequest) returns (Content);
  rpc CreateContent(CreateContentRequest) returns (Content);
  rpc UpdateContent(UpdateContentRequest) returns (Content);
  rpc DeleteContent(DeleteContentRequest) returns (DeleteContentResponse);
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
}

enum ContentStatus {
  CONTENT_STATUS_UNSPECIFIED = 0;
  CONTENT_STATUS_DRAFT = 1;
  CONTENT_STATUS_PUBLISHED = 2;
  CONTENT_STATUS_ARCHIVED = 3;
}

message Content {
  string id = 1;
  string title = 2;
  string body = 3;
  ContentStatus status = 4;
  string created_at = 5;
  string updated_at = 6;
}

message ListContentRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListContentResponse {
  repeated Content items = 1;
  int32 total = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message GetContentRequest {
  string id = 1;
}

message CreateContentRequest {
  string title = 1;
  string body = 2;
  ContentStatus status = 3;
}

message UpdateContentRequest {
  string id = 1;
  optional string title = 2;
  optional string body = 3;
  optional ContentStatus status = 4;
}

message DeleteContentRequest {
  string id = 1;
}

message DeleteContentResponse {
  bool success = 1;
}
