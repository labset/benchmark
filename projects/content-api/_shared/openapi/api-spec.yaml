openapi: 3.1.0
info:
  title: Content API
  description: >
    Benchmark API contract for content management.
    All implementations must conform to this specification.
  version: 1.0.0

paths:
  /api/v1/content:
    get:
      operationId: listContent
      summary: List all content items
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Paginated list of content items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentList'

    post:
      operationId: createContent
      summary: Create a new content item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContentRequest'
      responses:
        '201':
          description: Content item created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content'
        '400':
          description: Invalid request

  /api/v1/content/{id}:
    get:
      operationId: getContent
      summary: Get a content item by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Content item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content'
        '404':
          description: Not found

    put:
      operationId: updateContent
      summary: Update a content item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContentRequest'
      responses:
        '200':
          description: Content item updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Content'
        '404':
          description: Not found

    delete:
      operationId: deleteContent
      summary: Delete a content item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Content item deleted
        '404':
          description: Not found

components:
  schemas:
    Content:
      type: object
      required: [id, title, body, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        body:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ContentList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Content'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer

    CreateContentRequest:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        body:
          type: string
        status:
          type: string
          enum: [draft, published]
          default: draft

    UpdateContentRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        body:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
