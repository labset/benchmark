version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: content-api-connect-rpc/gen/proto
plugins:
  - protoc_builtin: go
    out: gen/proto
    opt: paths=source_relative
  - remote: connectrpc.com/connect
    out: gen/proto
    opt: paths=source_relative
