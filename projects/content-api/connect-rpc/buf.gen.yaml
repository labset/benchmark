version: v2
managed:
  enabled: true
  disable:
    - file_option: go_package
      module: buf.build/bufbuild/protovalidate
  override:
    - file_option: go_package_prefix
      value: content-api-connect-rpc/gen/proto
plugins:
  - protoc_builtin: go
    out: gen/proto
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go
    out: gen/proto
    opt: paths=source_relative
