services:
  api:
    build:
      context: ..
      dockerfile: connect-rpc/Dockerfile
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      - HEALTH_PORT=8080
      - GRPC_PORT=50051
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
